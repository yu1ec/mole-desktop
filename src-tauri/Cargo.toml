[package]
name = "mole-desktop"
version = "0.6.0"
description = "Cross-platform desktop cleaner and system toolkit"
authors = ["Mole Desktop"]
edition = "2021"
rust-version = "1.77.2"
license-file = "../LICENSE"

[lib]
name = "mole_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.38"
walkdir = "2"
rayon = "1"
trash = "5"
chrono = { version = "0.4", features = ["serde"] }
dirs = "7"
once_cell = "1"
thiserror = "2"
glob = "0.3"
dunce = "1"
anyhow = "1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
semver = "1"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[patch.crates-io]
sysinfo = { path = "vendor/sysinfo-0.38.0" }
