name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri_args: '--target universal-apple-darwin --no-sign'
          - platform: windows-latest
            rust_targets: ''
            tauri_args: '--target x86_64-pc-windows-msvc --no-sign'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          # The Tauri crate lives in src-tauri; its target dir is src-tauri/target.
          workspaces: 'src-tauri -> target'
          cache-on-failure: true

      - name: Install frontend dependencies
        run: npm ci

      # 用固定的自签名证书签名，而不是 ad-hoc。目的是让代码签名的
      # designated requirement 保持稳定，用户的完全磁盘访问等 TCC 授权
      # 不会每次发版都重置。证书由 scripts/macos-signing-cert.sh 生成。
      - name: Import macOS signing certificate
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MACOS_CERT_P12:-}" ] || [ -z "${MACOS_CERT_PASSWORD:-}" ]; then
            echo "::error::缺少 MACOS_CERT_P12 / MACOS_CERT_PASSWORD secret。"
            echo "::error::请先运行 bash scripts/macos-signing-cert.sh 并写入 secrets。"
            echo "::error::不要回退到 ad-hoc 签名，否则用户的系统授权会每次发版重置。"
            exit 1
          fi

          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"

          printf '%s' "$MACOS_CERT_P12" | openssl base64 -d -A -out "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # 允许 codesign 在无图形界面的 runner 上直接使用私钥。
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" >/dev/null
          # 临时 keychain 放进用户搜索列表，login keychain 保留；
          # system keychain 属于系统域，不需要写进这个列表。
          security list-keychains -d user -s "$keychain" \
            "$HOME/Library/Keychains/login.keychain-db"

          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -p codesigning "$keychain"

      - name: Validate version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | cut -d'"' -f2)
          TAURI_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          NPM_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ] || [ "$TAG_VERSION" != "$TAURI_VERSION" ] || [ "$TAG_VERSION" != "$NPM_VERSION" ]; then
            echo "Version mismatch:"
            echo "  tag:   $TAG_VERSION"
            echo "  cargo: $CARGO_VERSION"
            echo "  tauri: $TAURI_VERSION"
            echo "  npm:   $NPM_VERSION"
            exit 1
          fi
          echo "Version OK: $TAG_VERSION"

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          # Use the @tauri-apps/cli pinned in package-lock.json.
          tauriScript: npm run tauri
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Mole Desktop {0}', github.ref_name) || '' }}
          releaseBody: |
            ## Mole Desktop ${{ github.ref_name }}

            ### 下载
            - `Mole-Desktop-macos-universal.dmg` — macOS（Universal，Apple Silicon + Intel）
            - `Mole-Desktop-windows-x86_64.msi` — Windows（x86_64）
            - `Mole-Desktop-windows-x86_64-setup.exe` — Windows NSIS 安装器

            > macOS 安装包使用固定自签名证书签名（未公证）。首次打开如提示
            > “无法验证开发者”，请到「系统设置 → 隐私与安全性」点击「仍要打开」。
            > 签名身份跨版本固定，已授权的完全磁盘访问等权限升级后不会重置；
            > 如果仍遇到旧授权不生效，可执行
            > `tccutil reset SystemPolicyAllFiles com.moledesk.app` 后重新授权。
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          args: ${{ matrix.tauri_args }}

      - name: Publish stable asset names
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = "macos-latest" ]; then
            triple="universal-apple-darwin"
          else
            triple="x86_64-pc-windows-msvc"
          fi

          bundle_root="src-tauri/target/${triple}/release/bundle"
          if [ ! -d "$bundle_root" ]; then
            echo "Bundle directory not found: $bundle_root" >&2
            find src-tauri/target -type d -name bundle 2>/dev/null | sed 's/^/  /' || true
            exit 1
          fi
          echo "Using bundle root: $bundle_root"

          case "${{ matrix.platform }}" in
            macos-latest)
              dmg=$(find "$bundle_root/dmg" -name '*.dmg' -type f | head -1)
              app=$(find "$bundle_root/macos" -maxdepth 1 -name '*.app' -type d | head -1)
              if [ -z "$dmg" ] || [ -z "$app" ]; then
                echo "DMG or .app not found under $bundle_root" >&2
                exit 1
              fi
              # 固定证书签名：跨版本保持同一个 designated requirement，
              # TCC 授权（完全磁盘访问等）因此不会在升级后失效。
              if [ -z "${MACOS_SIGNING_IDENTITY:-}" ]; then
                echo "::error::缺少 MACOS_SIGNING_IDENTITY secret。" >&2
                exit 1
              fi
              codesign --force --deep --sign "$MACOS_SIGNING_IDENTITY" "$app"
              codesign --verify --deep --strict "$app"
              codesign -dv "$app" 2>&1 | sed 's/^/  /'
              requirement="$(codesign -d -r- "$app" 2>&1 || true)"
              echo "$requirement" | sed 's/^/  /'
              # ad-hoc 的 requirement 里是 cdhash，会随每次构建变化，必须拦住。
              if printf '%s' "$requirement" | grep -q 'cdhash'; then
                echo "::error::签名仍是 ad-hoc（requirement 含 cdhash），用户的系统授权会在发版后重置。" >&2
                exit 1
              fi
              # Rebuild the DMG from the signed bundle.
              staging=/tmp/mole-desktop-dmg
              rm -rf "$staging"
              mkdir -p "$staging"
              cp -R "$app" "$staging/"
              ln -s /Applications "$staging/Applications"
              hdiutil create -volname "Mole Desktop" -srcfolder "$staging" \
                -ov -format UDZO /tmp/Mole-Desktop-macos-universal.dmg
              # Replace the unsigned DMG uploaded by tauri-action, then publish the stable name.
              cp /tmp/Mole-Desktop-macos-universal.dmg "/tmp/$(basename "$dmg")"
              gh release upload "${{ github.ref_name }}" "/tmp/$(basename "$dmg")" --clobber
              gh release upload "${{ github.ref_name }}" /tmp/Mole-Desktop-macos-universal.dmg --clobber
              ;;
            windows-latest)
              msi=$(find "$bundle_root/msi" -name '*.msi' -type f | head -1)
              if [ -n "$msi" ]; then
                cp "$msi" /tmp/Mole-Desktop-windows-x86_64.msi
                gh release upload "${{ github.ref_name }}" /tmp/Mole-Desktop-windows-x86_64.msi --clobber
              fi
              setup=$(find "$bundle_root/nsis" -name '*-setup.exe' -type f | head -1)
              if [ -n "$setup" ]; then
                cp "$setup" /tmp/Mole-Desktop-windows-x86_64-setup.exe
                gh release upload "${{ github.ref_name }}" /tmp/Mole-Desktop-windows-x86_64-setup.exe --clobber
              fi
              if [ -z "$msi" ] && [ -z "$setup" ]; then
                echo "No MSI/NSIS installer found under $bundle_root" >&2
                exit 1
              fi
              ;;
          esac

      - name: Upload workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mole-desktop-${{ matrix.platform }}
          path: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*-setup.exe
          if-no-files-found: warn
